<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>화목의 사역 — 휘장을 넘어, 지성소로</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Cormorant:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@300;400;500;600;700&display=swap"
  rel="stylesheet"
/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
  :root {
    --cream: #f6ecd9;
    --cream-deep: #ecdfc4;
    --parchment: #f1e6cf;
    --sand: #e3d2ad;
    --gold: #b88a3e;
    --gold-deep: #8c6321;
    --gold-soft: #d6b46a;
    --ink: #2d1d0e;
    --ink-soft: #4a3622;
    --crimson: #8a3a30;
    --crimson-soft: #a14a3f;
    --veil: #5d3d4f;
    --shadow: rgba(60, 40, 15, 0.08);
  }

  * {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  html, body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Noto Serif KR', 'Nanum Myeongjo', serif;
    overflow-x: hidden;
  }

  .font-display { font-family: 'Cormorant Garamond', 'Nanum Myeongjo', serif; font-weight: 500; }
  .font-display-italic { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400; }
  .font-greek { font-family: 'Cormorant', 'Cormorant Garamond', serif; font-style: italic; }
  .font-han { font-family: 'Gowun Batang', 'Nanum Myeongjo', serif; }
  .font-body { font-family: 'Noto Serif KR', 'Nanum Myeongjo', serif; }

  /* Paper texture */
  .paper-grain {
    background-image:
      radial-gradient(circle at 20% 30%, rgba(184,138,62,0.06) 0px, transparent 1px),
      radial-gradient(circle at 70% 60%, rgba(45,29,14,0.04) 0px, transparent 1px),
      radial-gradient(circle at 40% 80%, rgba(184,138,62,0.05) 0px, transparent 1px);
    background-size: 3px 3px, 5px 5px, 7px 7px;
  }

  .vignette {
    box-shadow: inset 0 0 120px rgba(60, 40, 15, 0.12);
  }

  /* Decorative ornament */
  .ornament-line {
    display: flex;
    align-items: center;
    gap: 1rem;
    color: var(--gold);
  }
  .ornament-line::before,
  .ornament-line::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-soft), transparent);
  }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes drawLine {
    from { stroke-dashoffset: 1000; }
    to { stroke-dashoffset: 0; }
  }
  @keyframes lightBeam {
    0%, 100% { opacity: 0.4; transform: scaleY(1); }
    50% { opacity: 0.7; transform: scaleY(1.05); }
  }
  @keyframes flicker {
    0%, 100% { opacity: 0.85; }
    50% { opacity: 1; }
  }
  @keyframes drift {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(8px, -6px); }
  }
  @keyframes tearVeil {
    0% { transform: scaleY(1); opacity: 1; }
    100% { transform: scaleY(0.05) translateY(-50%); opacity: 0; }
  }
  @keyframes glowPulse {
    0%, 100% { filter: drop-shadow(0 0 6px rgba(184,138,62,0.4)); }
    50% { filter: drop-shadow(0 0 18px rgba(184,138,62,0.7)); }
  }

  .reveal {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 1s ease-out, transform 1s ease-out;
  }
  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .reveal-slow {
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 1.6s ease-out, transform 1.6s ease-out;
  }
  .reveal-slow.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Bible reference styling */
  .bible-ref {
    color: var(--gold-deep);
    border-bottom: 1px dashed var(--gold-soft);
    cursor: help;
    transition: all 0.2s;
    position: relative;
    font-weight: 500;
  }
  .bible-ref:hover {
    color: var(--crimson);
    border-bottom-color: var(--crimson);
  }

  /* Tooltip */
  .tooltip-card {
    position: absolute;
    z-index: 50;
    background: var(--parchment);
    border: 1px solid var(--gold-soft);
    box-shadow: 0 12px 40px rgba(60,40,15,0.18), inset 0 0 0 1px rgba(255,255,255,0.4);
    padding: 1rem 1.25rem;
    max-width: 360px;
    min-width: 240px;
    border-radius: 2px;
    font-size: 0.875rem;
    line-height: 1.7;
    color: var(--ink-soft);
    animation: fadeIn 0.3s ease-out;
  }
  .tooltip-card::before {
    content: '';
    position: absolute;
    top: -7px;
    left: 24px;
    width: 12px;
    height: 12px;
    background: var(--parchment);
    border-left: 1px solid var(--gold-soft);
    border-top: 1px solid var(--gold-soft);
    transform: rotate(45deg);
  }

  /* Hero light beam */
  .light-beam {
    position: absolute;
    top: -10%;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 120%;
    background: radial-gradient(ellipse at top, rgba(214,180,106,0.55), rgba(214,180,106,0.15) 40%, transparent 70%);
    filter: blur(20px);
    animation: lightBeam 6s ease-in-out infinite;
    pointer-events: none;
  }

  .candle-glow {
    animation: flicker 3s ease-in-out infinite;
  }

  /* Veil */
  .veil-curtain {
    background:
      linear-gradient(180deg, #5d3d4f 0%, #4a2f3f 50%, #3a2330 100%),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.1) 0 2px, transparent 2px 8px);
    background-blend-mode: multiply;
    transform-origin: top center;
    transition: transform 1.8s cubic-bezier(0.6, 0, 0.4, 1), opacity 1.8s ease-out;
  }
  .veil-tear-left {
    transform-origin: top right;
  }
  .veil-tear-right {
    transform-origin: top left;
  }
  .veil-torn .veil-tear-left {
    transform: perspective(800px) rotateY(-65deg) translateX(-10%);
    opacity: 0.4;
  }
  .veil-torn .veil-tear-right {
    transform: perspective(800px) rotateY(65deg) translateX(10%);
    opacity: 0.4;
  }

  /* Quiz card flip */
  .quiz-option {
    transition: all 0.25s ease;
    border: 1px solid rgba(184,138,62,0.3);
  }
  .quiz-option:hover:not(.answered) {
    border-color: var(--gold);
    background: rgba(184,138,62,0.06);
    transform: translateX(4px);
  }
  .quiz-option.correct {
    background: rgba(141, 110, 47, 0.12);
    border-color: var(--gold-deep);
    color: var(--gold-deep);
  }
  .quiz-option.wrong {
    background: rgba(138, 58, 48, 0.08);
    border-color: var(--crimson);
    color: var(--crimson);
    opacity: 0.7;
  }

  /* Greek word card */
  .greek-card {
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
    background: var(--parchment);
    border: 1px solid rgba(184,138,62,0.25);
  }
  .greek-card:hover {
    border-color: var(--gold);
    box-shadow: 0 12px 28px rgba(60,40,15,0.12);
    transform: translateY(-3px);
  }
  .greek-card.expanded {
    background: linear-gradient(180deg, var(--parchment), var(--cream));
    border-color: var(--gold);
    box-shadow: 0 16px 40px rgba(60,40,15,0.15);
  }

  /* Drop cap */
  .dropcap::first-letter {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 4em;
    float: left;
    line-height: 0.85;
    margin: 0.05em 0.12em -0.08em 0;
    color: var(--gold-deep);
  }

  /* Section dividers */
  .deco-asterism {
    color: var(--gold);
    letter-spacing: 0.5em;
    font-size: 0.9rem;
  }

  /* Footnote numbering */
  sup.footnote {
    color: var(--gold-deep);
    font-weight: 600;
    margin-left: 0.1em;
  }

  /* Scroll indicator */
  .scroll-hint {
    animation: drift 2.5s ease-in-out infinite;
  }

  /* Prayer section */
  .prayer-paper {
    background:
      linear-gradient(180deg, #f4e8cf, #ecdfc4),
      repeating-linear-gradient(0deg, transparent 0 28px, rgba(184,138,62,0.08) 28px 29px);
    background-blend-mode: multiply;
    border: 1px solid rgba(184,138,62,0.3);
    box-shadow: 0 30px 60px rgba(60,40,15,0.12), inset 0 0 0 1px rgba(255,255,255,0.5);
  }

  /* Hand drawn arrow */
  .hand-arrow {
    stroke-dasharray: 4 0;
  }

  /* Stage reveal */
  .stage-card {
    transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .stage-card:hover {
    transform: translateY(-4px);
  }

  /* Custom scrollbar */
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: var(--cream-deep); }
  ::-webkit-scrollbar-thumb { background: var(--gold-soft); border-radius: 0; }
  ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

  /* Selection */
  ::selection { background: var(--gold-soft); color: var(--ink); }

  /* Number badge */
  .number-badge {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    color: var(--gold-deep);
  }

  /* Mirror */
  .mirror-flip {
    transform: scaleY(-1);
    opacity: 0.25;
    mask-image: linear-gradient(180deg, black, transparent 80%);
    -webkit-mask-image: linear-gradient(180deg, black, transparent 80%);
  }

  @media (max-width: 768px) {
    .hide-mobile { display: none; }
  }

  /* ═════════════════════════════════════════════════════════
     PORTED FEATURES — Topbar, Side Panel, Bible Tooltip, TTS
     (themed to M2D1 cream/gold/ink)
     ═════════════════════════════════════════════════════════ */
  :root { --topbar-h: 44px; --font-scale: 1; }
  html { font-size: calc(16px * var(--font-scale)); }
  body { padding-top: var(--topbar-h); }

  /* Top bar */
  .topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);background:rgba(246,236,217,0.92);backdrop-filter:saturate(150%) blur(10px);-webkit-backdrop-filter:saturate(150%) blur(10px);border-bottom:1px solid rgba(184,138,62,0.3);display:flex;align-items:center;padding:0 10px;z-index:1000;gap:4px}
  .topbar-btn{flex-shrink:0;width:34px;height:34px;border:none;background:none;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);opacity:0.85;transition:background .15s, opacity .15s}
  .topbar-btn:hover{background:rgba(184,138,62,0.12);opacity:1;color:var(--gold-deep)}
  .topbar-title{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;font-weight:500;letter-spacing:0.12em;color:var(--gold-deep);scrollbar-width:none;-ms-overflow-style:none;padding:0 6px;text-transform:uppercase}
  .topbar-title::-webkit-scrollbar{display:none}
  .font-controls{display:flex;align-items:center;gap:2px;border:1px solid rgba(184,138,62,0.3);border-radius:4px;padding:2px;margin-left:4px}
  .font-ctrl-btn{width:26px;height:26px;border:none;background:transparent;color:var(--ink-soft);font-size:14px;cursor:pointer;border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif KR',serif}
  .font-ctrl-btn:hover{background:rgba(184,138,62,0.18);color:var(--gold-deep)}

  /* Overlay & Side panel */
  .overlay{position:fixed;inset:0;background:rgba(45,29,14,0.45);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:1001;opacity:0;pointer-events:none;transition:opacity .25s}
  .overlay.open{opacity:1;pointer-events:auto}
  .sidepanel{position:fixed;top:0;left:0;bottom:0;width:300px;max-width:82vw;background:linear-gradient(180deg,var(--cream) 0%,var(--cream-deep) 100%);z-index:1002;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow-y:auto;padding:20px 0;box-shadow:4px 0 32px rgba(60,40,15,0.3);font-family:'Noto Serif KR',serif;border-right:1px solid rgba(184,138,62,0.28)}
  .sidepanel.open{transform:translateX(0)}
  .sidepanel-header{padding:0 22px 16px;border-bottom:1px solid rgba(184,138,62,0.25);margin-bottom:12px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;font-weight:500;letter-spacing:0.28em;text-transform:uppercase;color:var(--gold-deep);display:flex;align-items:center;gap:8px}
  .sidepanel-close{margin-left:auto;width:28px;height:28px;border:none;background:transparent;border-radius:3px;cursor:pointer;font-size:14px;color:var(--ink-soft);opacity:0.7;display:flex;align-items:center;justify-content:center}
  .sidepanel-close:hover{background:rgba(184,138,62,0.18);color:var(--gold-deep);opacity:1}
  .sp-nav{display:block;padding:10px 22px;font-size:13px;color:var(--ink);text-decoration:none;cursor:pointer;transition:background .15s,color .15s;font-weight:400;letter-spacing:-0.005em;opacity:0.85}
  .sp-nav:hover{background:rgba(184,138,62,0.10);color:var(--gold-deep);opacity:1}
  .sp-nav.sub{padding-left:38px;font-size:12.5px;font-weight:300;color:var(--ink-soft);opacity:0.75}
  .sp-divider{height:1px;background:rgba(184,138,62,0.22);margin:10px 22px}
  .sp-home{display:flex;align-items:center;gap:8px;color:var(--gold-deep);opacity:0.95;font-weight:500}
  .sp-home-icon{flex-shrink:0;color:var(--gold-deep)}

  /* TTS Reader modal */
  .tts-reader-overlay{display:none;position:fixed;inset:0;background:rgba(45,29,14,0.65);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:2000;align-items:center;justify-content:center;padding:20px}
  .tts-reader-overlay.active{display:flex}
  .tts-reader-modal{background:linear-gradient(180deg,var(--cream) 0%,var(--cream-deep) 100%);border-radius:6px;max-width:520px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 22px 60px rgba(45,29,14,0.45);border:1px solid rgba(184,138,62,0.35);border-top:3px solid var(--gold);font-family:'Noto Serif KR',serif;color:var(--ink)}
  .tts-reader-header{padding:18px 22px 14px;border-bottom:1px dashed rgba(184,138,62,0.3);display:flex;align-items:center;gap:10px;flex-shrink:0}
  .tts-reader-icon{flex-shrink:0;color:var(--gold-deep)}
  .tts-reader-title{font-family:'Noto Serif KR',serif;font-size:1.05rem;font-weight:500;color:var(--ink);flex:1}
  .tts-reader-close{width:30px;height:30px;background:transparent;border:1px solid rgba(184,138,62,0.35);border-radius:50%;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;opacity:0.8}
  .tts-reader-close:hover{background:var(--gold);color:var(--cream);border-color:var(--gold);opacity:1}
  .tts-reader-body{padding:14px 22px;overflow-y:auto;flex:1}
  .tts-form-label{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:11px;font-weight:600;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:8px;margin-top:14px;display:block}
  .tts-form-label:first-child{margin-top:0}
  .tts-voice-select{width:100%;padding:10px 12px;border:1px solid rgba(184,138,62,0.35);border-radius:4px;font-family:inherit;font-size:13px;background:var(--parchment);color:var(--ink)}
  .tts-api-row{display:flex;gap:8px;align-items:center}
  .tts-api-row input{flex:1;padding:9px 11px;border:1px solid rgba(184,138,62,0.35);border-radius:4px;font-family:inherit;font-size:12px;background:var(--parchment);color:var(--ink)}
  .tts-api-row button{padding:9px 14px;border:1px solid var(--gold);background:var(--gold);color:var(--cream);border-radius:4px;font-size:11px;font-weight:700;letter-spacing:0.06em;cursor:pointer}
  .tts-api-row button:hover{background:var(--gold-deep)}
  .tts-section-list{border:1px solid rgba(184,138,62,0.25);border-radius:4px;background:var(--parchment);max-height:240px;overflow-y:auto}
  .tts-section-item{display:flex;align-items:flex-start;gap:10px;padding:9px 13px;cursor:pointer;border-bottom:1px solid rgba(184,138,62,0.18);font-size:13px;color:var(--ink);transition:background 0.15s}
  .tts-section-item:last-child{border-bottom:none}
  .tts-section-item:hover{background:rgba(184,138,62,0.08)}
  .tts-section-item.all{font-weight:600;color:var(--gold-deep);background:rgba(184,138,62,0.10)}
  .tts-section-item.playing{background:rgba(184,138,62,0.20);color:var(--gold-deep);font-weight:500}
  .tts-section-checkbox{flex-shrink:0;width:15px;height:15px;margin-top:2px;accent-color:var(--gold);cursor:pointer}
  .tts-section-label{flex:1;line-height:1.45}
  .tts-progress{margin-top:14px;padding:12px 14px;background:var(--parchment);border:1px solid rgba(184,138,62,0.25);border-radius:4px;display:none}
  .tts-progress.active{display:block}
  .tts-progress-bar{height:6px;background:rgba(184,138,62,0.18);border-radius:3px;overflow:hidden}
  .tts-progress-fill{height:100%;background:var(--gold-deep);width:0%;transition:width 0.3s}
  .tts-progress-text{font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.5}
  .tts-progress-text strong{color:var(--gold-deep)}
  .tts-status{font-size:11.5px;color:var(--ink-soft);margin-top:10px;font-style:italic;line-height:1.5;opacity:0.75}
  .tts-status.error{color:var(--crimson);font-style:normal;font-weight:600;opacity:1}
  .tts-reader-footer{padding:14px 22px 18px;border-top:1px solid rgba(184,138,62,0.25);display:flex;gap:10px;flex-shrink:0}
  .tts-btn{flex:1;padding:11px 16px;border:1px solid rgba(184,138,62,0.35);background:transparent;color:var(--ink);border-radius:4px;font-family:'Noto Serif KR',serif;font-size:12.5px;font-weight:600;letter-spacing:0.06em;cursor:pointer;transition:all 0.15s}
  .tts-btn:hover:not(:disabled){background:rgba(184,138,62,0.12);color:var(--gold-deep)}
  .tts-btn:disabled{opacity:0.4;cursor:not-allowed}
  .tts-btn.primary{background:var(--gold);border-color:var(--gold);color:var(--cream)}
  .tts-btn.primary:hover:not(:disabled){background:var(--gold-deep);color:var(--cream)}
  @media (max-width:480px){.tts-reader-modal{max-height:95vh}.tts-reader-body{padding:14px 16px}}

  /* Mobile-friendly adjustments to existing M2D1 layout */
  @media (max-width: 640px) {
    section { padding-left: 1rem !important; padding-right: 1rem !important; }
    .topbar-title { font-size: 11px; letter-spacing: 0.08em; }
    .greek-card { padding: 1.25rem !important; }
  }
</style>
</head>
<body>

<!-- TOP BAR (outside React root) -->
<div class="topbar" id="topbar">
  <button class="topbar-btn" onclick="togglePanel()" aria-label="목차"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
  <div class="topbar-title">화목의 사역 · 휘장을 넘어, 지성소로 · 고후 5:20</div>
  <button class="topbar-btn" onclick="ttsOpenReader()" aria-label="읽어주기"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></button>
  <div class="font-controls">
    <button class="font-ctrl-btn" onclick="adjustFont(-1)">−</button>
    <button class="font-ctrl-btn" onclick="adjustFont(0)" style="font-size:12px;">가</button>
    <button class="font-ctrl-btn" onclick="adjustFont(1)">+</button>
  </div>
</div>

<div class="overlay" id="overlay" onclick="togglePanel()"></div>

<!-- SIDE PANEL -->

<!-- Chrome JS (plain, runs outside React) -->
<script>
  // ─────── Font scaling, side panel ───────
  let fontScale = 1;
  function adjustFont(dir) {
    if (dir === 0) fontScale = 1;
    else if (dir === 1 && fontScale < 1.4) fontScale += 0.05;
    else if (dir === -1 && fontScale > 0.7) fontScale -= 0.05;
    document.documentElement.style.setProperty('--font-scale', fontScale);
  }
  function togglePanel() {
    document.getElementById('sidepanel').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('open');
  }
  function goTo(id) {
    togglePanel();
    setTimeout(() => {
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    }, 300);
  }

  // ─────── TTS Reader ───────
  const TTS_CONFIG = {
    serverUrl: 'https://qwen.tkhome.cloud',
    apiKey: localStorage.getItem('qwen_tts_api_key') || '',
    defaultVoice: 'tk_voice',
    sampleRate: 24000,
    pauseSec: 0.4,
    chunkMaxLen: 200
  };

  const TTS_SECTIONS = [
    { id: 'sec-hero',       title: '제목 — 화목의 사역' },
    { id: 'sec-verse',      title: '오늘의 구절 (고후 5:20) + 헬라어 묵상' },
    { id: 'sec-core',       title: '메시지의 심장' },
    { id: 'sec-stages',     title: '두 단계의 화목 (성막)' },
    { id: 'sec-veil',       title: '분리하는 휘장' },
    { id: 'sec-ambassador', title: '대사의 자격' },
    { id: 'sec-deeper',     title: '깊이 읽기' },
    { id: 'sec-prayer',     title: '오늘의 기도' }
  ];

  function ttsClean(text) {
    if (!text) return '';
    return text.replace(/\s+/g, ' ').replace(/\[[^\]]*\]/g, '').trim();
  }

  function ttsExtract(secId) {
    const root = document.getElementById(secId);
    if (!root) return '';
    const clone = root.cloneNode(true);
    // Drop decorative / non-readable elements:
    //  - SVGs, scroll cues
    //  - tooltip-card popups
    //  - Greek script (font-greek) and transliteration (font-display-italic) — keep meaning + text
    //  - veil curtains / hero dust particles
    clone.querySelectorAll('svg, .scroll-hint, .tooltip-card, .light-beam, .veil-curtain, .deco-asterism, .candle-glow, .number-badge, .font-greek, .mirror-flip').forEach(el => el.remove());
    return ttsClean(clone.textContent);
  }

  const TTS_EXTRACTORS = {};
  TTS_SECTIONS.forEach(s => { TTS_EXTRACTORS[s.id] = () => ttsExtract(s.id); });

  let ttsAudioContext = null;
  let ttsNextPlayTime = 0;
  let ttsScheduledSources = [];
  let ttsCurrentReader = null;
  let ttsIsCanceled = false;
  let ttsIsPlaying = false;
  let ttsIsPaused = false;

  function ttsPcmToBuffer(int16Bytes, ctx) {
    const evenLen = int16Bytes.byteLength - (int16Bytes.byteLength % 2);
    if (evenLen === 0) return null;
    const aligned = new Uint8Array(evenLen);
    aligned.set(int16Bytes.subarray(0, evenLen));
    const int16 = new Int16Array(aligned.buffer);
    const float32 = new Float32Array(int16.length);
    for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768;
    const buffer = ctx.createBuffer(1, float32.length, TTS_CONFIG.sampleRate);
    buffer.copyToChannel(float32, 0);
    return buffer;
  }

  function ttsScheduleBuffer(buffer) {
    if (!buffer || !ttsAudioContext) return;
    const source = ttsAudioContext.createBufferSource();
    source.buffer = buffer;
    source.connect(ttsAudioContext.destination);
    const now = ttsAudioContext.currentTime;
    if (ttsNextPlayTime < now) ttsNextPlayTime = now;
    source.start(ttsNextPlayTime);
    ttsScheduledSources.push(source);
    ttsNextPlayTime += buffer.duration;
    source.onended = () => {
      const idx = ttsScheduledSources.indexOf(source);
      if (idx >= 0) ttsScheduledSources.splice(idx, 1);
    };
  }

  function ttsStopPlayback() {
    ttsScheduledSources.forEach(src => { try { src.stop(); } catch(e) {} });
    ttsScheduledSources = [];
    ttsNextPlayTime = 0;
  }

  function ttsOpenReader() {
    document.getElementById('tts-reader-overlay').classList.add('active');
    document.body.style.overflow = 'hidden';
    ttsInitSectionList();
    if (TTS_CONFIG.apiKey) document.getElementById('tts-api-key').value = TTS_CONFIG.apiKey;
    ttsLoadVoices();
  }

  function ttsCloseReader() {
    if (ttsIsPlaying) {
      if (!confirm('재생 중입니다. 정말 닫으시겠습니까?')) return;
      ttsStop();
    }
    document.getElementById('tts-reader-overlay').classList.remove('active');
    document.body.style.overflow = '';
  }

  function ttsCloseOnBg(e) {
    if (e.target.id === 'tts-reader-overlay') ttsCloseReader();
  }

  function ttsSaveApiKey() {
    const input = document.getElementById('tts-api-key');
    TTS_CONFIG.apiKey = input.value.trim();
    localStorage.setItem('qwen_tts_api_key', TTS_CONFIG.apiKey);
    ttsSetStatus(TTS_CONFIG.apiKey ? 'API 키가 저장되었습니다.' : 'API 키가 비워졌습니다.');
    ttsLoadVoices();
  }

  function ttsInitSectionList() {
    const list = document.getElementById('tts-section-list');
    if (list.dataset.initialized === 'true') return;
    list.innerHTML = '';
    const allItem = document.createElement('label');
    allItem.className = 'tts-section-item all';
    allItem.innerHTML = '<input type="checkbox" class="tts-section-checkbox" id="tts-section-all" checked><span class="tts-section-label">전체 선택 / 해제</span>';
    allItem.querySelector('input').addEventListener('change', function() { ttsToggleAll(this); });
    list.appendChild(allItem);
    TTS_SECTIONS.forEach(sec => {
      const item = document.createElement('label');
      item.className = 'tts-section-item';
      item.dataset.sectionId = sec.id;
      item.innerHTML = '<input type="checkbox" class="tts-section-checkbox" data-section="' + sec.id + '" checked><span class="tts-section-label">' + sec.title + '</span>';
      list.appendChild(item);
    });
    list.dataset.initialized = 'true';
  }

  function ttsToggleAll(cb) {
    document.querySelectorAll('#tts-section-list input[data-section]').forEach(c => c.checked = cb.checked);
  }

  async function ttsLoadVoices() {
    const select = document.getElementById('tts-voice-select');
    try {
      const res = await fetch(TTS_CONFIG.serverUrl + '/voices');
      if (!res.ok) throw new Error('서버 응답 ' + res.status);
      const data = await res.json();
      select.innerHTML = '';
      if (!data.voices || data.voices.length === 0) {
        const opt = document.createElement('option');
        opt.textContent = '(등록된 음성 없음)';
        select.appendChild(opt);
        ttsSetStatus('등록된 음성이 없습니다.', true);
        return;
      }
      data.voices.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.name;
        opt.textContent = v.name + (v.name === data.default ? ' (기본)' : '');
        select.appendChild(opt);
      });
      if (data.default) select.value = data.default;
      ttsSetStatus(data.voices.length + '개 음성 로드 완료. 항목을 선택하고 재생을 누르세요.');
    } catch (e) {
      select.innerHTML = '<option>tk_voice</option>';
      ttsSetStatus('음성 목록 로드 실패: ' + e.message, true);
    }
  }

  function ttsSetStatus(msg, isError) {
    const el = document.getElementById('tts-status');
    el.textContent = msg;
    el.className = 'tts-status' + (isError ? ' error' : '');
  }

  function ttsUpdateProgress(current, total, sectionTitle) {
    document.getElementById('tts-progress').classList.add('active');
    document.getElementById('tts-progress-fill').style.width = (current / total * 100) + '%';
    document.getElementById('tts-progress-text').innerHTML = '<strong>' + current + ' / ' + total + '</strong> · ' + sectionTitle;
  }

  function ttsHighlightSection(sectionId) {
    document.querySelectorAll('#tts-section-list .tts-section-item').forEach(el => el.classList.remove('playing'));
    if (sectionId) {
      const item = document.querySelector('#tts-section-list .tts-section-item[data-section-id="' + sectionId + '"]');
      if (item) item.classList.add('playing');
    }
  }

  async function ttsPlay() {
    if (!TTS_CONFIG.apiKey) { ttsSetStatus('먼저 API 키를 입력하고 저장하세요.', true); return; }
    const checked = document.querySelectorAll('#tts-section-list input[data-section]:checked');
    if (checked.length === 0) { ttsSetStatus('읽을 항목을 하나 이상 선택하세요.', true); return; }
    const voice = document.getElementById('tts-voice-select').value;
    const selectedIds = Array.from(checked).map(cb => cb.dataset.section);
    const sectionsToRead = TTS_SECTIONS.filter(s => selectedIds.includes(s.id));

    ttsIsCanceled = false;
    ttsIsPlaying = true;
    document.getElementById('tts-play-btn').disabled = true;
    document.getElementById('tts-stop-btn').disabled = false;
    document.getElementById('tts-pause-btn').disabled = false;

    if (!ttsAudioContext || ttsAudioContext.state === 'closed') {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      try {
        ttsAudioContext = new Ctor({ sampleRate: TTS_CONFIG.sampleRate });
      } catch (e) {
        ttsAudioContext = new Ctor();
      }
    }
    if (ttsAudioContext.state === 'suspended') await ttsAudioContext.resume();
    ttsIsPaused = false;
    ttsUpdatePauseBtn();

    ttsStopPlayback();

    try {
      for (let i = 0; i < sectionsToRead.length; i++) {
        if (ttsIsCanceled) break;
        const sec = sectionsToRead[i];
        const extractor = TTS_EXTRACTORS[sec.id];
        if (!extractor) continue;
        ttsUpdateProgress(i + 1, sectionsToRead.length, sec.title);
        ttsHighlightSection(sec.id);
        ttsSetStatus('재생 중: ' + sec.title);
        const text = extractor();
        if (!text || text.trim().length < 2) continue;
        await ttsStreamText(text, voice);
        if (ttsIsCanceled) break;
      }
      while (!ttsIsCanceled) {
        if (ttsAudioContext.state === 'suspended') {
          await new Promise(r => setTimeout(r, 200));
          continue;
        }
        const remaining = ttsNextPlayTime - ttsAudioContext.currentTime;
        if (remaining <= 0) break;
        ttsSetStatus('재생 마무리 중... (남은 ' + remaining.toFixed(1) + '초)');
        await new Promise(r => setTimeout(r, Math.min(remaining * 1000 + 200, 1000)));
      }
      if (!ttsIsCanceled) ttsSetStatus('✅ 모든 항목 재생 완료');
      else ttsSetStatus('⏹ 중지됨');
    } catch (e) {
      ttsSetStatus('❌ 오류: ' + e.message, true);
    } finally {
      ttsIsPlaying = false;
      ttsIsPaused = false;
      ttsHighlightSection(null);
      document.getElementById('tts-play-btn').disabled = false;
      document.getElementById('tts-stop-btn').disabled = true;
      document.getElementById('tts-pause-btn').disabled = true;
      ttsUpdatePauseBtn();
      ttsCurrentReader = null;
    }
  }

  async function ttsStreamText(text, voice) {
    const res = await fetch(TTS_CONFIG.serverUrl + '/tts/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': TTS_CONFIG.apiKey },
      body: JSON.stringify({ text: text, voice: voice, pause_sec: TTS_CONFIG.pauseSec, chunk_max_len: TTS_CONFIG.chunkMaxLen })
    });
    if (!res.ok) {
      let errMsg = 'HTTP ' + res.status;
      try { const err = await res.json(); errMsg = err.detail || errMsg; } catch(e) {}
      throw new Error(errMsg);
    }
    const reader = res.body.getReader();
    ttsCurrentReader = reader;
    let buffer = new Uint8Array(0);
    const MIN_DECODE = 24000;
    while (true) {
      let done, value;
      try { ({ done, value } = await reader.read()); }
      catch (e) { if (ttsIsCanceled) break; throw e; }
      if (done || ttsIsCanceled) {
        if (buffer.length >= 2 && !ttsIsCanceled) ttsScheduleBuffer(ttsPcmToBuffer(buffer, ttsAudioContext));
        break;
      }
      const merged = new Uint8Array(buffer.length + value.length);
      merged.set(buffer);
      merged.set(value, buffer.length);
      buffer = merged;
      while (buffer.length >= MIN_DECODE && !ttsIsCanceled) {
        const evenLen = MIN_DECODE - (MIN_DECODE % 2);
        const audioBuffer = ttsPcmToBuffer(buffer.subarray(0, evenLen), ttsAudioContext);
        if (audioBuffer) ttsScheduleBuffer(audioBuffer);
        buffer = buffer.subarray(evenLen);
      }
    }
  }

  async function ttsStop() {
    ttsIsCanceled = true;
    if (ttsCurrentReader) { try { await ttsCurrentReader.cancel(); } catch(e) {} ttsCurrentReader = null; }
    ttsStopPlayback();
    if (ttsAudioContext && ttsAudioContext.state === 'suspended') {
      try { await ttsAudioContext.resume(); } catch(e) {}
    }
    ttsIsPaused = false;
    ttsSetStatus('⏹ 중지됨');
    document.getElementById('tts-play-btn').disabled = false;
    document.getElementById('tts-stop-btn').disabled = true;
    document.getElementById('tts-pause-btn').disabled = true;
    ttsUpdatePauseBtn();
    ttsIsPlaying = false;
    ttsHighlightSection(null);
  }

  async function ttsTogglePause() {
    if (!ttsIsPlaying || !ttsAudioContext) return;
    if (ttsIsPaused) {
      try { await ttsAudioContext.resume(); } catch(e) {}
      ttsIsPaused = false;
      ttsSetStatus('▶ 재생 재개됨');
    } else {
      try { await ttsAudioContext.suspend(); } catch(e) {}
      ttsIsPaused = true;
      ttsSetStatus('⏸ 일시정지됨');
    }
    ttsUpdatePauseBtn();
  }

  function ttsUpdatePauseBtn() {
    const btn = document.getElementById('tts-pause-btn');
    if (!btn) return;
    btn.textContent = ttsIsPaused ? '▶ 계속' : '⏸ 일시정지';
  }
</script>

/* ============================================================
   BIBLE XML LOADER (Recovery Version)
   ============================================================ */
const BIBLE_XML_PATH = '../../recovery_bible_ko.xml';
let BIBLE_DATA = null;
let bibleLoadPromise = null;
const bibleListeners = new Set();

async function loadBibleXML() {
  if (bibleLoadPromise) return bibleLoadPromise;
  bibleLoadPromise = (async () => {
    try {
      const res = await fetch(BIBLE_XML_PATH);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const xml = new DOMParser().parseFromString(text, 'application/xml');
      const data = {};
      xml.querySelectorAll('Book').forEach(book => {
        const abbrev = book.getAttribute('abbrevKo');
        if (!abbrev) return;
        const bk = data[abbrev] = {};
        book.querySelectorAll('Chapter').forEach(chap => {
          const cnum = chap.getAttribute('num');
          const ch = bk[cnum] = {};
          chap.querySelectorAll('Verse').forEach(v => {
            ch[v.getAttribute('num')] = v.textContent;
          });
        });
      });
      BIBLE_DATA = data;
      window.BIBLE_DATA = data;
      bibleListeners.forEach(fn => { try { fn(); } catch(e) {} });
      return true;
    } catch (e) {
      console.warn('[Bible] XML load failed:', e);
      return false;
    }
  })();
  return bibleLoadPromise;
}

function lookupBibleByRef(refKey) {
  // refKey format: "고후 5:20" or "고후 5:20-21" or "고후 5:18-19"
  if (!refKey) return null;
  const m = refKey.match(/^(\S+)\s+(\d+):(\d+)(?:-(\d+))?$/);
  if (!m) return null;
  const [, book, chap, vsStr, veStr] = m;
  if (!BIBLE_DATA || !BIBLE_DATA[book] || !BIBLE_DATA[book][chap]) return null;
  const ch = BIBLE_DATA[book][chap];
  if (!veStr || vsStr === veStr) return ch[vsStr] ? [{ n: vsStr, t: ch[vsStr] }] : null;
  const s = parseInt(vsStr, 10), e = parseInt(veStr, 10);
  const list = [];
  for (let i = s; i <= e; i++) {
    if (ch[i]) list.push({ n: String(i), t: ch[i] });
  }
  return list.length ? list : null;
}

/* ============================================================
   TOOLTIP COMPONENT
   ============================================================ */
function BibleRef({ children, refKey }) {
  const [show, setShow] = useState(false);
  const [coords, setCoords] = useState({ top: 0, left: 0 });
  const [, forceUpdate] = useState(0);
  const ref = useRef(null);

  // Re-render when XML loads so tooltips shown before load can refresh.
  useEffect(() => {
    const fn = () => forceUpdate(v => v + 1);
    bibleListeners.add(fn);
    return () => { bibleListeners.delete(fn); };
  }, []);

  const handleEnter = () => {
    if (ref.current) {
      const rect = ref.current.getBoundingClientRect();
      setCoords({
        top: rect.bottom + window.scrollY + 10,
        left: rect.left + window.scrollX
      });
    }
    setShow(true);
  };

  // Prefer XML lookup; fall back to static map.
  const xmlVerses = lookupBibleByRef(refKey);
  const staticText = BIBLE_REFS[refKey];
  const hasContent = xmlVerses || staticText;

  return (
    <span className="relative inline">
      <span
        ref={ref}
        className="bible-ref"
        onMouseEnter={handleEnter}
        onMouseLeave={() => setShow(false)}
        onClick={handleEnter}
      >
        {children || refKey}
      </span>
      {show && hasContent && (
        <span
          className="tooltip-card font-body"
          style={{ top: coords.top + 'px', left: coords.left + 'px', position: 'absolute' }}
        >
          <span className="block font-display text-xs tracking-widest uppercase mb-1.5" style={{color: 'var(--gold-deep)'}}>{refKey}</span>
          {xmlVerses ? (
            <span className="block">
              {xmlVerses.map((v, i) => (
                <span key={i} className="block mb-1">
                  <span style={{color: 'var(--gold-deep)', fontStyle: 'italic', fontWeight: 600, marginRight: '6px'}}>{v.n}</span>
                  {v.t}
                </span>
              ))}
            </span>
          ) : (
            <span className="block">{staticText}</span>
          )}
        </span>
      )}
    </span>
  );
}

/* ============================================================
   SCROLL REVEAL HOOK
   ============================================================ */
function useReveal() {
  useEffect(() => {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.15 });

    document.querySelectorAll('.reveal, .reveal-slow').forEach((el) => observer.observe(el));
    return () => observer.disconnect();
  }, []);
}

/* ============================================================
   5. THE VEIL SCENE
   ============================================================ */
function VeilScene() {
  const [torn, setTorn] = useState(false);

  // Auto-tear when scrolled into view
  const sectionRef = useRef(null);
  useEffect(() => {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          setTimeout(() => setTorn(true), 600);
        }
      });
    }, { threshold: 0.5 });
    if (sectionRef.current) observer.observe(sectionRef.current);
    return () => observer.disconnect();
  }, []);

  return (
    <section ref={sectionRef} className="py-32 px-6 relative overflow-hidden"
      style={{background: 'linear-gradient(180deg, #2a1a0d 0%, #1d1208 100%)'}}>

      <div className="max-w-5xl mx-auto">

        <div className="text-center mb-12">

            The Dividing Veil
          </p>
          <h2 className="font-han text-3xl md:text-5xl mb-6" style={{color: '#f4e8cf', fontWeight: 700}}>
            분리하는 휘장

                  backgroundImage: 'repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0 1px, transparent 1px 6px)'

                {/* Cherubim hint */}

                }} />

                  <circle cx="20" cy="15" r="6" fill="none" stroke="rgba(214,180,106,0.6)" strokeWidth="0.8" />
                  <path d="M5 30 Q20 20 35 30 M5 38 Q20 28 35 38" stroke="rgba(214,180,106,0.6)" strokeWidth="0.8" fill="none" />

                  background: 'radial-gradient(ellipse at center, rgba(214,180,106,0.5), transparent 70%)',
