<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F5EE">
<title>Seven Feasts · 1년 7차 집회 추구 자료</title>
<meta name="description" content="해마다 일곱 차례의 집회와 훈련 자료를 한 곳에서 빠르게 찾아보세요.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />

<style>
/* ==================== RESET ==================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
img, svg { display: block; max-width: 100%; }
button, input { font: inherit; color: inherit; }
button { background: none; border: none; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ==================== TOKENS ==================== */
:root {
  --bg:         #FAF7F0;
  --bg-pane:    #FFFFFF;
  --bg-sidebar: #F1ECDF;
  --bg-hover:   #E8E0CB;
  --bg-active:  #E0D5B8;
  --ink:        #1A1612;
  --ink-soft:   #4D453A;
  --ink-mute:   #877C6A;
  --line:       #D5CBB2;
  --line-soft:  #E5DDC6;

  --accent:     #1F5552;
  --accent-2:   #C9A04F;

  --c1: #1F5552; --c2: #6B8E5A; --c3: #C84A38; --c4: #D4A22B;
  --c5: #B86A26; --c6: #8E3B24; --c7: #2A3D6B;

  --font-body: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;

  --sidebar-w: 304px;
  --topbar-h: 56px;
  --radius: 10px;
  --shadow-pane: 0 1px 2px rgba(26, 22, 18, 0.04), 0 8px 24px -12px rgba(26, 22, 18, 0.12);
}

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}
::selection { background: var(--accent); color: #fff; }

/* hide scrollbars subtly */
.sidebar::-webkit-scrollbar, .main::-webkit-scrollbar { width: 8px; height: 8px; }
.sidebar::-webkit-scrollbar-thumb, .main::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
.sidebar::-webkit-scrollbar-thumb:hover, .main::-webkit-scrollbar-thumb:hover { background: var(--ink-mute); }

/* ==================== APP SHELL ==================== */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: var(--topbar-h) 1fr;
  grid-template-areas: "topbar topbar" "sidebar main";
  height: 100vh;
  height: 100dvh;
}

/* ==================== TOPBAR ==================== */
.topbar {
  grid-area: topbar;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 20px;
  background: var(--bg);
  border-bottom: 1px solid var(--line-soft);
  z-index: 30;
}
.topbar__left { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.topbar__menu-btn {
  display: none;
  width: 36px; height: 36px;
  align-items: center; justify-content: center;
  border-radius: 8px;
  color: var(--ink-soft);
}
.topbar__menu-btn:hover { background: var(--bg-hover); color: var(--ink); }
.topbar__menu-btn svg { width: 20px; height: 20px; }
.topbar__brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--ink);
  padding: 4px 8px;
  margin-left: -8px;
  border-radius: 6px;
  transition: background .15s;
}
.topbar__brand:hover { background: var(--bg-hover); }
.topbar__brand-mark {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: conic-gradient(from -90deg,
    var(--c1) 0deg 51deg,
    var(--c2) 51deg 102deg,
    var(--c3) 102deg 153deg,
    var(--c4) 153deg 205deg,
    var(--c5) 205deg 256deg,
    var(--c6) 256deg 307deg,
    var(--c7) 307deg 360deg);
}
.topbar__breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--ink-soft);
  padding-left: 14px;
  margin-left: 4px;
  border-left: 1px solid var(--line);
  min-width: 0;
}
.topbar__breadcrumb a { color: var(--ink-soft); transition: color .15s; }
.topbar__breadcrumb a:hover { color: var(--ink); }
.topbar__breadcrumb-sep { color: var(--ink-mute); }
.topbar__breadcrumb-current {
  color: var(--ink);
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 360px;
}
.topbar__center { flex: 1; display: flex; justify-content: center; padding: 0 8px; min-width: 0; }
.topbar__search-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  max-width: 480px;
  height: 36px;
  padding: 0 12px 0 14px;
  background: var(--bg-pane);
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 13px;
  color: var(--ink-mute);
  transition: border-color .15s, background .15s, box-shadow .15s;
}
.topbar__search-btn:hover { border-color: var(--ink-mute); box-shadow: var(--shadow-pane); }
.topbar__search-btn svg { width: 14px; height: 14px; opacity: 0.7; flex-shrink: 0; }
.topbar__search-btn-text { flex: 1; text-align: left; }
.topbar__search-btn kbd {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-soft);
  padding: 2px 6px;
  background: var(--bg-sidebar);
  border: 1px solid var(--line-soft);
  border-radius: 4px;
}
.topbar__right { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.topbar__icon-btn {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 8px;
  color: var(--ink-soft);
  transition: background .15s, color .15s;
}
.topbar__icon-btn:hover { background: var(--bg-hover); color: var(--ink); }
.topbar__icon-btn svg { width: 18px; height: 18px; }

/* ==================== SIDEBAR ==================== */
.sidebar {
  grid-area: sidebar;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--line-soft);
  overflow-y: auto;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
}
.sidebar__head {
  padding: 18px 16px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sidebar__head-label {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-mute);
}
.sidebar__head-action {
  font-size: 12px;
  color: var(--ink-mute);
  transition: color .15s;
  font-weight: 500;
}
.sidebar__head-action:hover { color: var(--ink); }
.sidebar__nav { padding: 0 8px 24px; flex: 1; }
.sidebar__footer {
  padding: 14px 16px;
  border-top: 1px solid var(--line-soft);
  font-size: 11px;
  color: var(--ink-mute);
  font-family: var(--font-mono);
  letter-spacing: 0.04em;
  display: flex;
  justify-content: space-between;
}

.year-group { margin-bottom: 2px; }
.year-group__head {
  display: flex;
  align-items: center;
  width: 100%;
  padding: 8px 10px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  text-align: left;
  letter-spacing: -0.01em;
  transition: background .15s;
}
.year-group__head:hover { background: var(--bg-hover); }
.year-group__chev {
  width: 16px; height: 16px;
  margin-right: 6px;
  flex-shrink: 0;
  color: var(--ink-mute);
  transition: transform .2s;
}
.year-group.is-open .year-group__chev { transform: rotate(90deg); }
.year-group__num {
  flex: 1;
  font-variant-numeric: tabular-nums;
}
.year-group__status {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-mute);
  padding: 2px 7px;
  background: var(--bg);
  border-radius: 999px;
  font-variant-numeric: tabular-nums;
}
.year-group__head--current { background: var(--bg-active); }
.year-group__head--current .year-group__num { color: var(--accent); }
.year-group__head--current .year-group__status { background: var(--accent); color: #fff; }

.year-group__list {
  display: none;
  padding: 2px 0 6px 26px;
  margin-left: 5px;
  border-left: 1px solid var(--line-soft);
}
.year-group.is-open .year-group__list { display: block; }

.feast-item {
  display: flex;
  align-items: center;
  padding: 7px 10px;
  border-radius: 6px;
  font-size: 13.5px;
  color: var(--ink-soft);
  letter-spacing: -0.005em;
  transition: background .15s, color .15s;
  position: relative;
}
.feast-item::before {
  content: '';
  position: absolute;
  left: -27px;
  top: 50%;
  width: 12px;
  height: 1px;
  background: var(--line-soft);
}
.feast-item:hover { background: var(--bg-hover); color: var(--ink); }
.feast-item.is-active {
  background: var(--bg-pane);
  color: var(--ink);
  font-weight: 600;
  box-shadow: 0 0 0 1px var(--feast-color) inset;
}
.feast-item__dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-right: 10px;
  flex-shrink: 0;
  background: transparent;
  border: 1.5px solid var(--feast-color);
}
.feast-item.is-revealed .feast-item__dot { background: var(--feast-color); }
.feast-item__num {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-mute);
  margin-right: 10px;
  width: 16px;
  text-align: right;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}
.feast-item.is-active .feast-item__num { color: var(--feast-color); font-weight: 600; }
.feast-item__name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.feast-item--upcoming { color: var(--ink-mute); }
.feast-item--upcoming .feast-item__name { font-style: italic; }

/* ==================== MAIN PANE ==================== */
.main {
  grid-area: main;
  background: var(--bg);
  overflow-y: auto;
  overscroll-behavior: contain;
}
.content {
  max-width: 880px;
  margin: 0 auto;
  padding: 32px 32px 80px;
}

/* ==================== YEAR OVERVIEW ==================== */
.overview__head { padding: 16px 0 28px; }
.overview__eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 8px;
}
.overview__year {
  font-size: clamp(64px, 9vw, 112px);
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.04em;
  margin-bottom: 14px;
  font-variant-numeric: tabular-nums;
}
.overview__meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 14px;
  color: var(--ink-soft);
}
.overview__meta-divider { width: 1px; height: 12px; background: var(--line); }
.overview__meta strong { color: var(--accent); font-weight: 600; }
.overview__progress {
  display: flex;
  gap: 4px;
  margin-top: 20px;
  max-width: 420px;
}
.overview__progress span {
  flex: 1;
  height: 4px;
  border-radius: 2px;
  background: var(--line-soft);
}
.overview__progress span.is-filled { background: var(--bar-color); }

.overview__feasts {
  display: grid;
  gap: 8px;
  margin-top: 28px;
}

.feast-card {
  background: var(--bg-pane);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  padding: 16px 20px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 18px;
  align-items: center;
  color: var(--ink);
  transition: border-color .2s, box-shadow .2s, transform .2s;
  position: relative;
  overflow: hidden;
}
.feast-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--feast-color);
  transition: width .2s;
}
.feast-card:hover {
  border-color: var(--feast-color);
  box-shadow: var(--shadow-pane);
}
.feast-card:hover::before { width: 5px; }
.feast-card__num {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--feast-color);
  width: 24px;
  text-align: center;
}
.feast-card__main { min-width: 0; }
.feast-card__type {
  font-size: 11.5px;
  font-weight: 500;
  color: var(--ink-mute);
  letter-spacing: -0.005em;
  margin-bottom: 3px;
}
.feast-card__theme {
  font-size: 16px;
  font-weight: 700;
  line-height: 1.4;
  letter-spacing: -0.015em;
  color: var(--ink);
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
}
.feast-card__subtitle {
  font-size: 13px;
  color: var(--ink-soft);
  margin-top: 3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.feast-card__meta {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-mute);
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  flex-shrink: 0;
  text-align: right;
}
.feast-card__meta-count { color: var(--feast-color); font-weight: 600; }
.feast-card--upcoming { border-style: dashed; background: transparent; }
.feast-card--upcoming .feast-card__theme {
  font-style: italic;
  color: var(--ink-mute);
  font-weight: 500;
}
.feast-card--upcoming::before { opacity: 0.4; }

/* ==================== DETAIL VIEW ==================== */
.detail { padding: 8px 0 0; }
.detail__nav {
  display: flex;
  align-items: stretch;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 28px;
}
.detail__nav-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: 8px;
  color: var(--ink-soft);
  transition: background .15s, color .15s;
  flex: 1;
  min-width: 0;
  max-width: 280px;
}
.detail__nav-btn:hover { background: var(--bg-hover); color: var(--ink); }
.detail__nav-btn[hidden] { visibility: hidden; }
.detail__nav-btn--right { justify-content: flex-end; text-align: right; }
.detail__nav-arrow {
  width: 18px; height: 18px;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-mute);
  flex-shrink: 0;
}
.detail__nav-label {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  min-width: 0;
}
.detail__nav-btn--right .detail__nav-label { align-items: flex-end; }
.detail__nav-label small {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-mute);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.detail__nav-label span {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.detail__chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 12px 5px 8px;
  background: var(--bg-pane);
  border: 1px solid var(--line-soft);
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-soft);
  margin-bottom: 14px;
}
.detail__chip-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--feast-color);
}
.detail__chip-num {
  font-family: var(--font-mono);
  font-weight: 600;
  color: var(--feast-color);
}

.detail__theme {
  font-size: clamp(28px, 4vw, 40px);
  font-weight: 800;
  line-height: 1.25;
  letter-spacing: -0.025em;
  margin-bottom: 16px;
}
.detail__subtitle {
  font-size: 17px;
  line-height: 1.55;
  color: var(--ink-soft);
  margin-bottom: 28px;
  padding: 4px 0 4px 16px;
  border-left: 2px solid var(--feast-color);
}
.detail__meta {
  display: flex;
  flex-wrap: wrap;
  gap: 28px;
  padding: 14px 0;
  border-top: 1px solid var(--line-soft);
  border-bottom: 1px solid var(--line-soft);
  margin-bottom: 32px;
}
.detail__meta-item { display: flex; flex-direction: column; gap: 2px; }
.detail__meta-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-mute);
}
.detail__meta-value { font-size: 13.5px; font-weight: 500; color: var(--ink); }

.detail__outline-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 16px;
}
.detail__outline-title {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.detail__outline-count {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink-mute);
  font-variant-numeric: tabular-nums;
}
.detail__outline {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-bottom: 32px;
}
.detail__outline li {
  display: grid;
  grid-template-columns: 40px 1fr;
  gap: 12px;
  padding: 12px 12px 12px 4px;
  border-radius: 6px;
  font-size: 15px;
  line-height: 1.65;
  color: var(--ink);
  transition: background .15s;
}
.detail__outline li:hover { background: var(--bg-pane); }
.detail__outline-num {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--feast-color);
  font-weight: 600;
  padding-top: 4px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.detail__link {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 12px 22px;
  background: var(--ink);
  color: var(--bg);
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 32px;
  transition: background .2s, transform .15s;
}
.detail__link:hover { background: var(--accent); }
.detail__link:active { transform: scale(0.98); }
.detail__link svg { width: 14px; height: 14px; }

.detail__no-outline {
  padding: 32px;
  background: var(--bg-pane);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  text-align: center;
  margin-bottom: 32px;
}
.detail__no-outline-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 6px;
}
.detail__no-outline-text {
  font-size: 13.5px;
  color: var(--ink-mute);
  line-height: 1.6;
}

.detail__upcoming {
  padding: 56px 24px;
  text-align: center;
  border: 1px dashed var(--line);
  border-radius: var(--radius);
  background: var(--bg-pane);
  margin-bottom: 32px;
}
.detail__upcoming-icon {
  font-size: 28px;
  color: var(--feast-color);
  margin-bottom: 14px;
  opacity: 0.5;
}
.detail__upcoming-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
.detail__upcoming-text { font-size: 13.5px; color: var(--ink-soft); }

/* ==================== HOME PAGE ==================== */
.home {
  max-width: 920px;
  margin: 0 auto;
  padding: 0 0 32px;
}

/* SEARCH SECTION */
.home__search-section {
  padding: 88px 0 56px;
  text-align: center;
}
.home__eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 18px;
  display: inline-flex;
  align-items: center;
  gap: 12px;
}
.home__eyebrow::before, .home__eyebrow::after {
  content: '';
  width: 18px;
  height: 1px;
  background: var(--line);
}
.home__prompt {
  font-size: clamp(34px, 5vw, 56px);
  font-weight: 800;
  line-height: 1.18;
  letter-spacing: -0.025em;
  margin-bottom: 14px;
  color: var(--ink);
}
.home__prompt em {
  font-family: 'Cormorant Garamond', 'Pretendard Variable', serif;
  font-style: italic;
  font-weight: 500;

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));
const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const truncate = (s, n) => s.length > n ? s.substring(0, n) + '…' : s;

// =============================================================
// ROUTER
// =============================================================
function parseHash() {
  const h = (window.location.hash || '').replace(/^#\/?/, '');
  if (!h || h === 'home') return { home: true };
  const parts = h.split('/').filter(Boolean);
  if (parts[0] === 'home') return { home: true };
  const year = parseInt(parts[0], 10);
  if (!YEARS.find(y => y.year === year)) return { home: true };
  if (parts[1]) {
    const feast = parseInt(parts[1], 10);
    if (feast >= 1 && feast <= 7) return { year, feast };
  }
  return { year, feast: null };
}

function navigate(year, feast) {
  const hash = feast ? `#/${year}/${feast}` : `#/${year}`;
  if (window.location.hash !== hash) window.location.hash = hash;
}

// SIDEBAR
// =============================================================
function buildSidebar() {
  const nav = $('#sidebarNav');
  nav.innerHTML = YEARS.map((yd) => {
    const revealed = yd.feasts.filter(f => f !== null).length;
    const items = yd.feasts.map((f, i) => {
      const meta = FEASTS[i];
      const isRevealed = f !== null;
      const label = isRevealed ? truncate(f.topic, 20) : meta.name;
      return `
        <a class="feast-item ${isRevealed ? 'is-revealed' : 'feast-item--upcoming'}"
           href="#/${yd.year}/${i+1}"
           data-year="${yd.year}" data-feast="${i+1}"
           style="--feast-color:${meta.hex}">
          <span class="feast-item__dot"></span>
          <span class="feast-item__num">${String(i+1).padStart(2,'0')}</span>
          <span class="feast-item__name">${escapeHtml(label)}</span>
        </a>
      `;
    }).join('');
    return `
      <div class="year-group is-open" data-year="${yd.year}">
        <button class="year-group__head" data-year="${yd.year}" type="button">

function updateSidebarActive(state) {

function findAdjacent(year, feastIdx, dir) {
  // dir = -1 (prev) or +1 (next)
  // YEARS is descending order (2026 first → 2018 last). prev = earlier in time = later in array.
  // next feast within year: feastIdx + 1 (within same year)
  // crossing years: prev means going BACK in time → moving DOWN in array (yIdx + 1)
  //                 next means going FORWARD in time → moving UP in array (yIdx - 1)
  const yIdx = YEARS.findIndex(y => y.year === year);
  let tY = yIdx, tF;
  if (dir === 1) { // next feast (forward in number)
    if (feastIdx < 6) { tF = feastIdx + 1; }
    else {
      // wrap to next year forward in time (yIdx-1)
      if (yIdx === 0) return null;
      tY = yIdx - 1; tF = 0;
    }
  } else { // prev feast
    if (feastIdx > 0) { tF = feastIdx - 1; }
    else {
      if (yIdx === YEARS.length - 1) return null;
      tY = yIdx + 1; tF = 6;
    }
  }
  const ty = YEARS[tY];
  const f = ty.feasts[tF];
  const meta = FEASTS[tF];
  return {
    year: ty.year,
    feast: tF + 1,
    label: f ? truncate(f.topic, 24) : meta.name,
    color: meta.hex,
    num: tF + 1,
  };
}

function renderHomeCloud() {
  const topics = [
    '그리스도', '결정 연구', '교회생활', '왕국', '그리스도의 몸',
    '한 새사람', '신성한 삼일성', '영적 전쟁', '경륜', '신부',
    '회복', '체험', '누림', '부활', '사도행전', '마태복음',
    '로마서', '생명', '하나님의 뜻', '진리'
  ];

  const data = topics.map(t => {
    const results = search(t) || [];
    const counts = {};
    results.forEach(r => { counts[r.feastIdx] = (counts[r.feastIdx] || 0) + 1; });
    let max = 0, dominantIdx = 0;
    for (const k in counts) {
      if (counts[k] > max) { max = counts[k]; dominantIdx = parseInt(k, 10); }
    }
    return { topic: t, count: results.length, color: results.length > 0 ? FEASTS[dominantIdx].hex : 'var(--ink-mute)' };
  }).filter(d => d.count > 0).sort((a, b) => b.count - a.count);

  const sizeClass = (count) => {
    if (count >= 18) return 'xl';
    if (count >= 8) return 'lg';
    if (count >= 4) return 'md';
    if (count >= 2) return 'sm';
    return 'xs';
  };

  const itemsHtml = data.map(d => `
    <button class="home__cloud-item home__cloud-item--${sizeClass(d.count)}"
            data-query="${escapeHtml(d.topic)}"
            type="button"
            style="--topic-color:${d.color}">
      ${escapeHtml(d.topic)}<span class="home__cloud-count">${d.count}</span>

  return `
    <section class="home__section">
      <header class="home__section-head">
        <div class="home__section-title-wrap">
          <span class="home__section-num">02</span>
          <h2 class="home__section-title">주제로 <em>둘러보기</em></h2>

        <span class="home__section-sub">By topic · ${data.length} keywords</span>
      </header>
      <div class="home__cloud">${itemsHtml}</div>
    </section>
  `;
}

// =============================================================
// SEARCH
// =============================================================
let searchIndex = [];
function buildSearchIndex() {
  searchIndex = [];
  YEARS.forEach(yd => {
    yd.feasts.forEach((f, i) => {
      if (!f) return;
      const meta = FEASTS[i];
      searchIndex.push({
        year: yd.year,
        feast: i + 1,
        feastIdx: i,
        feastName: meta.name,
        topic: f.topic,
        subtitle: f.subtitle || '',
        messages: f.outline || [],
        color: meta.hex,
      });
    });
  });
}

function highlight(text, query) {
  if (!query) return escapeHtml(text);
  const lower = text.toLowerCase();
  const q = query.toLowerCase();
  let out = '';
  let i = 0;
  while (i < text.length) {
    const idx = lower.indexOf(q, i);
    if (idx === -1) { out += escapeHtml(text.substring(i)); break; }
    out += escapeHtml(text.substring(i, idx));
    out += `<span class="search-result__hl">${escapeHtml(text.substring(idx, idx + q.length))}</span>`;
    i = idx + q.length;
  }
  return out;
}

function search(rawQ) {
  const q = rawQ.trim().toLowerCase();
  if (!q) return null;
  const results = [];
  searchIndex.forEach(item => {
    const matches = [];
    if (item.topic.toLowerCase().includes(q)) matches.push({ field: 'topic', text: item.topic });
    if (item.subtitle && item.subtitle.toLowerCase().includes(q)) matches.push({ field: 'subtitle', text: item.subtitle });
    if (item.feastName.toLowerCase().includes(q)) matches.push({ field: 'feast', text: item.feastName });
    item.messages.forEach((m, mi) => {
      if (m.toLowerCase().includes(q)) matches.push({ field: 'message', text: m, idx: mi });
    });
    if (String(item.year).includes(q)) matches.push({ field: 'year', text: String(item.year) });
    if (matches.length > 0) results.push({ ...item, matches });
  });
  return results;
}

function renderSearchResults(rawQ) {
  const wrap = $('#searchResults');
  const counter = $('#searchCount');
  const results = search(rawQ);

  if (results === null) {
    counter.textContent = '';
    wrap.innerHTML = `
      <div class="search-modal__empty">
        <div class="search-modal__empty-text">키워드로 빠르게 자료를 찾아보세요</div>
        <div class="search-modal__empty-tags">
          ${['그리스도', '왕국', '결정 연구', '여름 훈련', '2025', '신부', '한 새사람'].map(t =>
            `<button class="search-modal__empty-tag" data-tag="${t}">${t}</button>`
          ).join('')}
        </div>
      </div>
    `;
    return;
  }
  if (results.length === 0) {
    counter.textContent = '';
    wrap.innerHTML = `<div class="search-modal__no-results">"${escapeHtml(rawQ)}" 에 대한 결과가 없습니다.</div>`;
    return;
  }

  counter.textContent = `${results.length}개 결과`;
  wrap.innerHTML = results.map((r, i) => {
    // Pick the most prominent match
    const topMatch = r.matches.find(m => m.field === 'topic') 
                  || r.matches.find(m => m.field === 'feast')
                  || r.matches[0];
    let title = highlight(r.topic, rawQ);
    let snippet;
    if (topMatch.field === 'message') {
      snippet = `메시지 ${(r.outline ? '' : '')}${topMatch.idx + 1}: ${highlight(topMatch.text, rawQ)}`;
    } else if (topMatch.field === 'subtitle') {
      snippet = highlight(r.subtitle, rawQ);
    } else if (topMatch.field === 'feast') {
      snippet = highlight(r.subtitle || r.topic, rawQ);
    } else {
      snippet = r.subtitle ? highlight(r.subtitle, rawQ) : (r.messages.length ? highlight(r.messages[0], rawQ) : '');
    }
    return `
      <a class="search-result ${i === 0 ? 'is-active' : ''}" data-href="#/${r.year}/${r.feast}" style="--feast-color:${r.color}" data-idx="${i}">
        <div class="search-result__bc">
          <span class="search-result__bc-dot"></span>
          <span>${r.year} · ${String(r.feast).padStart(2,'0')} · ${highlight(r.feastName, rawQ)}</span>
        </div>
        <div class="search-result__title">${title}</div>
        ${snippet ? `<div class="search-result__snippet">${snippet}</div>` : ''}
      </a>
    `;
  }).join('');
}

// =============================================================
// SEARCH MODAL CONTROL
// =============================================================
let searchActiveIdx = 0;
function openSearch() {
  $('#searchModal').classList.add('is-open');
  setTimeout(() => $('#searchInput').focus(), 50);
  renderSearchResults('');
  document.body.style.overflow = 'hidden';
}
function closeSearch() {
  $('#searchModal').classList.remove('is-open');
  $('#searchInput').value = '';
  document.body.style.overflow = '';
}
function isSearchOpen() { return $('#searchModal').classList.contains('is-open'); }

function setupSearch() {
  $('#searchBtn').addEventListener('click', openSearch);
  $('#searchClose').addEventListener('click', closeSearch);
  $('#searchModal').addEventListener('click', (e) => {
    if (e.target === $('#searchModal')) closeSearch();
  });
  $('#searchInput').addEventListener('input', (e) => {
    searchActiveIdx = 0;
    renderSearchResults(e.target.value);
  });
  $('#searchResults').addEventListener('click', (e) => {
    const tag = e.target.closest('.search-modal__empty-tag');
    if (tag) {
      $('#searchInput').value = tag.dataset.tag;
      renderSearchResults(tag.dataset.tag);
      $('#searchInput').focus();
      return;
    }
    const result = e.target.closest('.search-result');
    if (result) {
      const href = result.dataset.href;
      closeSearch();
      window.location.hash = href.replace(/^#/, '');
    }
  });
  // Keyboard within search
  $('#searchInput').addEventListener('keydown', (e) => {
    const results = $$('.search-result');
    if (results.length === 0) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      searchActiveIdx = Math.min(searchActiveIdx + 1, results.length - 1);
      results.forEach((r, i) => r.classList.toggle('is-active', i === searchActiveIdx));
      results[searchActiveIdx].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      searchActiveIdx = Math.max(searchActiveIdx - 1, 0);
      results.forEach((r, i) => r.classList.toggle('is-active', i === searchActiveIdx));
      results[searchActiveIdx].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      e.preventDefault();
      const active = results[searchActiveIdx];
      if (active) {
        const href = active.dataset.href;
        closeSearch();
        window.location.hash = href.replace(/^#/, '');
      }
    }
  });
}

// =============================================================
// GLOBAL KEYBOARD
// =============================================================
function isFormFocused() {
  const el = document.activeElement;
  if (!el) return false;
  const tag = el.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable;
}

function setupGlobalKeyboard() {
  document.addEventListener('keydown', (e) => {
    // ⌘K / Ctrl+K opens search
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      if (isSearchOpen()) closeSearch();
      else openSearch();
      return;
    }
    // "/" opens search (when not focused in input)
    if (e.key === '/' && !isFormFocused() && !isSearchOpen()) {
      e.preventDefault();
      openSearch();
      return;
    }
    // Esc closes search
    if (e.key === 'Escape' && isSearchOpen()) {
      e.preventDefault();
      closeSearch();
      return;
    }
    // Arrow nav in detail
    if (!isFormFocused() && !isSearchOpen()) {
      const state = parseHash();
      if (!state.feast) return;
      if (e.key === 'ArrowLeft') {
        const prev = findAdjacent(state.year, state.feast - 1, -1);
        if (prev) navigate(prev.year, prev.feast);
      } else if (e.key === 'ArrowRight') {
        const next = findAdjacent(state.year, state.feast - 1, 1);
        if (next) navigate(next.year, next.feast);
      }
    }
  });
}

// =============================================================
// MOBILE DRAWER
// =============================================================
function setupMobile() {
  const sidebar = $('#sidebar');
  const backdrop = $('#backdrop');
  const menuBtn = $('#menuBtn');

  function open() {
    sidebar.classList.add('is-open');
    backdrop.classList.add('is-open');
  }
  function close() {
    sidebar.classList.remove('is-open');
    backdrop.classList.remove('is-open');
  }

  menuBtn.addEventListener('click', open);
  backdrop.addEventListener('click', close);

  // Close drawer when navigating on mobile
  window.addEventListener('hashchange', () => {
    if (window.innerWidth <= 880) close();
  });

  // Close drawer on link click in sidebar (mobile)
  sidebar.addEventListener('click', (e) => {
    if (window.innerWidth > 880) return;
    if (e.target.closest('.feast-item') || e.target.closest('.year-group__head:not([data-chev])')) {
      // small delay to let navigation happen smoothly
      setTimeout(close, 100);
    }
  });
}

// =============================================================
// TOGGLE ALL
// =============================================================
function setupToggleAll() {
  const btn = $('#toggleAll');
  let allOpen = true;
  btn.addEventListener('click', () => {
    allOpen = !allOpen;
    $$('.year-group').forEach(g => g.classList.toggle('is-open', allOpen));
    btn.textContent = allOpen ? '전부 접기' : '전부 펼치기';
    // Keep current year open
    if (!allOpen) {
      const state = parseHash();
      const current = document.querySelector(`.year-group[data-year="${state.year}"]`);
      if (current) current.classList.add('is-open');
    }
  });
}

// =============================================================
// INIT
// =============================================================
function render() {
  const state = parseHash();
  renderContent(state);
  updateSidebarActive(state);
  updateBreadcrumb(state);
}

buildSidebar();
buildSearchIndex();
setupSearch();
setupGlobalKeyboard();
setupMobile();
setupToggleAll();
render();

window.addEventListener('hashchange', render);
</script>
